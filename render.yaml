services:
  - type: web
    name: socniti-backend
    env: node
    buildCommand: npm install
    startCommand: npm start --workspace @socniti/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: socniti-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://your-vercel-frontend-url.vercel.app

databases:
  - name: socniti-db
    databaseName: socniti
    user: socniti_user
    plan: free
