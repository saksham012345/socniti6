services:
  - type: web
    name: socniti-api-gateway
    env: node
    buildCommand: npm install
    startCommand: npm start --workspace @socniti/api-gateway
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://your-vercel-frontend-url.vercel.app

  - type: web
    name: socniti-auth-service
    env: node
    buildCommand: npm install
    startCommand: npm start --workspace @socniti/auth-service
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: socniti-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: socniti-event-service
    env: node
    buildCommand: npm install
    startCommand: npm start --workspace @socniti/event-service
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: socniti-db
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: socniti-auth-service
          envVarKey: JWT_SECRET

  - type: web
    name: socniti-chat-service
    env: node
    buildCommand: npm install
    startCommand: npm start --workspace @socniti/chat-service
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: socniti-db
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: socniti-auth-service
          envVarKey: JWT_SECRET

  - type: web
    name: socniti-donation-service
    env: node
    buildCommand: npm install
    startCommand: npm start --workspace @socniti/donation-service
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: socniti-db
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: socniti-auth-service
          envVarKey: JWT_SECRET

databases:
  - name: socniti-db
    databaseName: socniti
    user: socniti_user
    plan: free
